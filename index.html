<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер чтения</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Трекер чтения</h1>
        <p class="subtitle">Список книг, прогресс чтения и рецензии</p>

        <div id="message" class="message" hidden></div>

        <form id="bookForm" class="book-form">
            <input type="text" id="titleInput" placeholder="Название книги" required>
            <input type="text" id="authorInput" placeholder="Автор" required>
            <input type="number" id="pagesInput" placeholder="Кол-во страниц" min="1" required>
            <button type="submit">Добавить книгу</button>
        </form>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Поиск по названию или автору...">
            <select id="filterSelect">
                <option value="">Все статусы</option>
                <option value="Запланировано">Запланировано</option>
                <option value="Читаю">Читаю</option>
                <option value="Прочитано">Прочитано</option>
                <option value="Брошено">Брошено</option>
            </select>
            <select id="sortSelect">
                <option value="title">По названию</option>
                <option value="author">По автору</option>
                <option value="progress">По прогрессу</option>
            </select>
        </div>

        <div id="bookList" class="book-list"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
